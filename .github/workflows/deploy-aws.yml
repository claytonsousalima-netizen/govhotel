# ============================================================
# GitHub Actions — Deploy Workflow
#
# Trigger:
#   - Pull Request para main-aws:
#       Smoke build apenas
#
#   - Push para main-aws:
#       Build + Push GHCR + Deploy AWS EC2 via SSM
#
# Ambiente:
#   AWS EC2
#   Docker Swarm
#   AWS Systems Manager (SSM)
#   GitHub Container Registry (GHCR)
# ============================================================

name: deploy-aws

on:
  pull_request:
    branches:
      - main-aws

  push:
    branches:
      - main-aws

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: govhotel
  AWS_REGION: us-east-1

  STACK_NAME: govhotel
  SERVICE_NAME: govhotel_app

  APP_DIR: /opt/app-govhotel
  COMPOSE_FILE: /opt/app-govhotel/docker-compose.yml

  # Ajuste caso a porta publicada pelo Swarm seja diferente
  APP_PORT: 80


jobs:

  # ==========================================================
  # Smoke Build
  # ==========================================================

  smoke-build:

    name: Smoke Build (Validate Dockerfile)

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================
  # Build + Push + Deploy
  # ==========================================================

  build-and-deploy:

    name: Build & Deploy to AWS

    runs-on: ubuntu-latest

    needs:
      - smoke-build

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # QEMU
      # --------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64


      # --------------------------------------------------------
      # Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # GHCR Login
      # --------------------------------------------------------

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Build + Push
      # --------------------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:

          context: .

          platforms: linux/arm64

          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # --------------------------------------------------------
      # AWS Credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Encontrar EC2
      # --------------------------------------------------------

      - name: Find EC2 instance
        id: find-instance

        run: |

          set -euo pipefail

          echo "Finding EC2 instance..."

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=estancorp-rouparia-prod-app" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --region "${AWS_REGION}")


          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "None" ]; then

            echo "[FAIL] Could not find running EC2 instance."

            echo "Expected tag:"
            echo "Name=estancorp-rouparia-prod-app"

            exit 1

          fi


          echo "Found instance: ${INSTANCE_ID}"

          echo "instance_id=${INSTANCE_ID}" >> "${GITHUB_OUTPUT}"


      # --------------------------------------------------------
      # Deploy via SSM
      # --------------------------------------------------------

      - name: Execute deployment on EC2 via SSM
        id: ssm-deploy

        env:

          INSTANCE_ID: ${{ steps.find-instance.outputs.instance_id }}

          IMAGE_TAG: ${{ github.sha }}

          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GHCR_USERNAME: ${{ github.actor }}

          REGISTRY_ORG: ${{ github.repository_owner }}

        run: |

          set -euo pipefail


          # ====================================================
          # Encode token
          # ====================================================

          GHCR_TOKEN_B64=$(printf '%s' "${GHCR_TOKEN}" | base64 -w 0)


          # ====================================================
          # Script executado dentro da EC2
          # ====================================================

          cat > /tmp/deploy.sh << 'DEPLOYEOF'

          #!/bin/bash

          set -euo pipefail


          echo "============================================================"
          echo "Canary Deploy: govhotel"
          echo "============================================================"


          # ====================================================
          # Configurações
          # ====================================================

          STACK_NAME="govhotel"

          SERVICE_NAME="govhotel_app"

          APP_DIR="/opt/app-govhotel"

          COMPOSE_FILE="/opt/app-govhotel/docker-compose.yml"

          APP_PORT="80"

          IMAGE_TAG="IMAGE_TAG_PLACEHOLDER"

          REGISTRY_ORG="REGISTRY_ORG_PLACEHOLDER"

          GHCR_USERNAME="GHCR_USERNAME_PLACEHOLDER"

          GHCR_TOKEN_B64="GHCR_TOKEN_B64_PLACEHOLDER"


          IMAGE="ghcr.io/${REGISTRY_ORG}/govhotel:${IMAGE_TAG}"


          echo ""
          echo "Stack:"
          echo "${STACK_NAME}"

          echo ""
          echo "Service:"
          echo "${SERVICE_NAME}"

          echo ""
          echo "Compose:"
          echo "${COMPOSE_FILE}"

          echo ""
          echo "Image:"
          echo "${IMAGE}"

          echo ""
          echo "Commit:"
          echo "${IMAGE_TAG}"


          # ====================================================
          # Validar pasta
          # ====================================================

          if [ ! -d "${APP_DIR}" ]; then

            echo ""
            echo "[FAIL] Application directory not found:"
            echo "${APP_DIR}"

            exit 1

          fi


          # ====================================================
          # Validar compose
          # ====================================================

          if [ ! -f "${COMPOSE_FILE}" ]; then

            echo ""
            echo "[FAIL] Docker compose file not found:"
            echo "${COMPOSE_FILE}"

            exit 1

          fi


          # ====================================================
          # Diretório da aplicação
          # ====================================================

          cd "${APP_DIR}"


          # ====================================================
          # GHCR Login
          # ====================================================

          echo ""
          echo "Authenticating on GHCR..."


          GHCR_TOKEN=$(printf '%s' "${GHCR_TOKEN_B64}" | base64 -d)


          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            -u "${GHCR_USERNAME}" \
            --password-stdin


          unset GHCR_TOKEN


          echo "[OK] GHCR authenticated"


          # ====================================================
          # Pull explícito
          # ====================================================

          echo ""
          echo "Pulling image:"
          echo "${IMAGE}"


          docker pull "${IMAGE}"


          echo "[OK] Image pulled"


          # ====================================================
          # IMAGE_TAG usado pelo docker-compose
          # ====================================================

          export IMAGE_TAG


          # ====================================================
          # Criar / atualizar .env
          #
          # Mantive porque seu GovHotel já utilizava esse arquivo.
          # ====================================================

          echo ""
          echo "Updating application .env..."


          cat > "${APP_DIR}/.env" << EOF
          STACK_NAME=${STACK_NAME}
          IMAGE_TAG=${IMAGE_TAG}
          REGISTRY_ORG=${REGISTRY_ORG}
          EOF


          echo "[OK] .env updated"


          # ====================================================
          # Validar configuração Swarm
          # ====================================================

          echo ""
          echo "============================================================"
          echo "Resolved Docker Stack configuration"
          echo "============================================================"


          docker stack config \
            -c "${COMPOSE_FILE}"


          # ====================================================
          # Descobrir imagem resolvida
          # ====================================================

          RESOLVED_IMAGE=$(docker stack config \
            -c "${COMPOSE_FILE}" \
            | awk '/^[[:space:]]*image:/ {print $2}' \
            | head -1)


          echo ""
          echo "============================================================"
          echo "Image validation"
          echo "============================================================"

          echo ""
          echo "Expected:"
          echo "${IMAGE}"

          echo ""
          echo "Resolved:"
          echo "${RESOLVED_IMAGE}"


          # ====================================================
          # Impedir deploy de imagem incorreta
          # ====================================================

          if [ "${RESOLVED_IMAGE}" != "${IMAGE}" ]; then

            echo ""
            echo "[FAIL] Docker compose resolved an unexpected image."

            echo ""
            echo "Expected:"
            echo "${IMAGE}"

            echo ""
            echo "Resolved:"
            echo "${RESOLVED_IMAGE}"

            echo ""
            echo "Verify:"
            echo "${COMPOSE_FILE}"

            exit 1

          fi


          echo ""
          echo "[OK] Stack configuration validated"


          # ====================================================
          # Deploy
          # ====================================================

          echo ""
          echo "============================================================"
          echo "Deploying Docker Stack"
          echo "============================================================"


          docker stack deploy \
            -c "${COMPOSE_FILE}" \
            "${STACK_NAME}" \
            --with-registry-auth


          echo ""
          echo "[OK] Stack deploy command executed"


          # ====================================================
          # Monitorar rollout
          # ====================================================

          echo ""
          echo "============================================================"
          echo "Monitoring Canary Rollout"
          echo "============================================================"


          for i in $(seq 1 36); do


            REPLICAS=$(docker service ls \
              --filter "name=${SERVICE_NAME}" \
              --format "{{.Replicas}}" \
              2>/dev/null \
              | head -1)


            if [ -z "${REPLICAS}" ]; then
              REPLICAS="0/0"
            fi


            RUNNING=$(echo "${REPLICAS}" | cut -d/ -f1)

            DESIRED=$(echo "${REPLICAS}" | cut -d/ -f2)


            echo ""
            echo "[$i/36] ${SERVICE_NAME}: ${REPLICAS}"


            # ==================================================
            # Mostrar tasks com erro
            # ==================================================

            FAILED_TASKS=$(docker service ps "${SERVICE_NAME}" \
              --no-trunc \
              --format "{{.CurrentState}} | {{.Error}}" \
              2>/dev/null \
              | grep -E "Failed|Rejected" \
              || true)


            if [ -n "${FAILED_TASKS}" ]; then

              echo ""
              echo "Detected failed/rejected tasks:"
              echo "${FAILED_TASKS}"

            fi


            # ==================================================
            # Rollout completo
            # ==================================================

            if [ "${RUNNING}" = "${DESIRED}" ] && \
               [ "${RUNNING}" -gt 0 ] 2>/dev/null; then


              echo ""
              echo "[OK] All replicas are running"


              # ================================================
              # Health Check
              # ================================================

              echo ""
              echo "============================================================"
              echo "Health Check"
              echo "============================================================"


              for h in $(seq 1 12); do


                HTTP=$(curl \
                  --silent \
                  --output /dev/null \
                  --write-out "%{http_code}" \
                  --max-time 5 \
                  "http://127.0.0.1:${APP_PORT}/healthz" \
                  2>/dev/null \
                  || echo "000")


                echo "[health ${h}/12] HTTP ${HTTP}"


                if [ "${HTTP}" = "200" ]; then


                  echo ""
                  echo "============================================================"
                  echo "[OK] GOVHOTEL DEPLOY SUCCESSFUL"
                  echo "============================================================"

                  echo ""
                  echo "Image:"
                  echo "${IMAGE}"

                  echo ""
                  echo "Service:"
                  echo "${SERVICE_NAME}"

                  echo ""
                  echo "Replicas:"
                  echo "${REPLICAS}"

                  exit 0

                fi


                sleep 5

              done


              # ================================================
              # Health check falhou
              # ================================================

              echo ""
              echo "[FAIL] Health check failed after rollout"


              echo ""
              echo "============================================================"
              echo "Docker Service Status"
              echo "============================================================"


              docker service ps "${SERVICE_NAME}" \
                --no-trunc \
                || true


              echo ""
              echo "============================================================"
              echo "Docker Service Logs"
              echo "============================================================"


              docker service logs \
                "${SERVICE_NAME}" \
                --tail 100 \
                2>&1 \
                || true


              exit 1

            fi


            sleep 10

          done


          # ====================================================
          # Timeout
          # ====================================================

          echo ""
          echo "[FAIL] Rollout timed out"


          echo ""
          echo "============================================================"
          echo "Docker Service Status"
          echo "============================================================"


          docker service ps "${SERVICE_NAME}" \
            --no-trunc \
            || true


          echo ""
          echo "============================================================"
          echo "Docker Service Logs"
          echo "============================================================"


          docker service logs \
            "${SERVICE_NAME}" \
            --tail 100 \
            2>&1 \
            || true


          exit 1


          DEPLOYEOF


          # ====================================================
          # Substituir placeholders
          # ====================================================

          sed -i \
            "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_TAG}|g" \
            /tmp/deploy.sh


          sed -i \
            "s|REGISTRY_ORG_PLACEHOLDER|${REGISTRY_ORG}|g" \
            /tmp/deploy.sh


          sed -i \
            "s|GHCR_USERNAME_PLACEHOLDER|${GHCR_USERNAME}|g" \
            /tmp/deploy.sh


          sed -i \
            "s|GHCR_TOKEN_B64_PLACEHOLDER|${GHCR_TOKEN_B64}|g" \
            /tmp/deploy.sh


          chmod +x /tmp/deploy.sh


          # ====================================================
          # Gerar JSON do SSM
          # ====================================================

          jq \
            -n \
            --rawfile cmd /tmp/deploy.sh \
            '{"commands":[$cmd]}' \
            > /tmp/params.json


          # ====================================================
          # Enviar comando
          # ====================================================

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/params.json \
            --output-s3-bucket-name "estancorp-ssm-logs" \
            --output-s3-key-prefix "govhotel-deployments" \
            --region "${AWS_REGION}" \
            --comment "Canary deploy govhotel ${IMAGE_TAG}" \
            --query "Command.CommandId" \
            --output text)


          echo ""
          echo "SSM Command ID:"
          echo "${COMMAND_ID}"


          echo "command_id=${COMMAND_ID}" >> "${GITHUB_OUTPUT}"


      # --------------------------------------------------------
      # Monitorar SSM
      # --------------------------------------------------------

      - name: Monitor SSM command execution

        env:

          COMMAND_ID: ${{ steps.ssm-deploy.outputs.command_id }}

          INSTANCE_ID: ${{ steps.find-instance.outputs.instance_id }}

        run: |

          set -euo pipefail


          for i in $(seq 1 60); do


            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text \
              --region "${AWS_REGION}" \
              2>/dev/null \
              || echo "Pending")


            echo "[${i}/60] Command status: ${STATUS}"


            case "${STATUS}" in


              Success)

                echo ""
                echo "=========================================="
                echo "Deployment completed successfully!"
                echo "=========================================="

                exit 0

                ;;


              Failed|TimedOut|Cancelled)

                echo ""
                echo "[FAIL] Deployment failed (${STATUS})"


                echo ""
                echo "============================================================"
                echo "SSM Command Output"
                echo "============================================================"


                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --region "${AWS_REGION}" \
                  || true


                exit 1

                ;;


            esac


            sleep 10

          done


          echo ""
          echo "[FAIL] SSM command timed out"

          exit 1


      # --------------------------------------------------------
      # Final
      # --------------------------------------------------------

      - name: Deployment complete
        if: success()

        run: |

          echo "============================================================"
          echo "Deployment completed successfully!"
          echo "============================================================"

          echo ""

          echo "Image:"
          echo "${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}:${{ github.sha }}"

          echo ""

          echo "Instance:"
          echo "${{ steps.find-instance.outputs.instance_id }}"

          echo ""

          echo "Stack:"
          echo "${STACK_NAME}"

          echo ""

          echo "Service:"
          echo "${SERVICE_NAME}"