# ============================================================
# GitHub Actions — Deploy Workflow
#
# Trigger: PR or push to main-aws branch
# Purpose: Canary deploy to AWS EC2 via Docker Swarm
# - PR: smoke build only (validates Dockerfile)
# - Push: full build, push, and deploy with health checks
# ============================================================

name: deploy-aws

on:
  pull_request:
    branches:
      - main-aws
  push:
    branches:
      - main-aws

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1

jobs:
  smoke-build:
    name: Smoke Build (Validate Dockerfile)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest
    needs: smoke-build
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find EC2 instance
        id: find-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=estancorp-rouparia-prod-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "ERROR: Could not find running EC2 instance with tag Name=estancorp-rouparia-prod-app"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found instance: $INSTANCE_ID"

      - name: Generate deployment script
        id: deploy-script
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          cat > /tmp/deploy.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e

          echo "Starting deployment..."

          # Environment variables passed from GitHub Actions
          export IMAGE_TAG="${IMAGE_TAG:-latest}"
          export REGISTRY_ORG="claytonsousalima-netizen"
          export STACK_NAME="govhotel"

          # Create/update .env file
          cat > /opt/app-govhotel/.env << EOF
          STACK_NAME=govhotel
          IMAGE_TAG=$IMAGE_TAG
          REGISTRY_ORG=$REGISTRY_ORG
          EOF

          # Login to GHCR
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          # Pull latest image
          docker pull ghcr.io/$REGISTRY_ORG/govhotel:$IMAGE_TAG

          # Deploy to Docker Swarm
          cd /opt/app-govhotel
          docker stack deploy -c docker-compose.yml $STACK_NAME --with-registry-auth

          echo "Deployment initiated. Monitoring rollout..."

          # Monitor rollout (36 attempts × 10s = 6 minutes max)
          for i in {1..36}; do
            REPLICAS=$(docker service ls --filter name=$STACK_NAME --format "{{.Replicas}}" 2>/dev/null | head -1 || echo "0/0")
            echo "[$i/36] Replicas: $REPLICAS"

            if [[ "$REPLICAS" == "2/2" ]]; then
              echo "✓ All replicas ready!"
              break
            fi

            sleep 10
          done

          # Health check (12 attempts × 5s = 60s max)
          echo "Running health checks..."
          for i in {1..12}; do
            if curl -f -s http://127.0.0.1/healthz > /dev/null 2>&1; then
              echo "✓ Health check passed!"
              exit 0
            fi

            echo "[$i/12] Health check waiting..."
            sleep 5
          done

          echo "✗ Health check failed!"
          exit 1
          DEPLOY_SCRIPT

          chmod +x /tmp/deploy.sh
          echo "Deploy script generated."

      - name: Execute deployment on EC2 via SSM
        id: ssm-deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.find-instance.outputs.instance_id }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=cat > /tmp/deploy.sh << '"'"'EOF'"'"'
          #!/bin/bash
          set -e

          echo "Starting deployment..."

          # Environment variables
          export IMAGE_TAG="${{ github.sha }}"
          export REGISTRY_ORG="claytonsousalima-netizen"
          export STACK_NAME="govhotel"

          # Create/update .env file
          mkdir -p /opt/app-govhotel
          cat > /opt/app-govhotel/.env << EOF
          STACK_NAME=govhotel
          IMAGE_TAG=$IMAGE_TAG
          REGISTRY_ORG=$REGISTRY_ORG
          EOF

          # Login to GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Pull image
          docker pull ghcr.io/$REGISTRY_ORG/govhotel:$IMAGE_TAG

          # Deploy
          cd /opt/app-govhotel
          docker stack deploy -c docker-compose.yml $STACK_NAME --with-registry-auth

          echo "Deployment initiated. Monitoring..."

          # Monitor rollout
          for i in {1..36}; do
            REPLICAS=$(docker service ls --filter name=$STACK_NAME --format "{{.Replicas}}" 2>/dev/null | head -1 || echo "0/0")
            echo "[$i/36] Replicas: $REPLICAS"

            if [[ "$REPLICAS" == "2/2" ]]; then
              echo "✓ All replicas ready!"
              break
            fi

            sleep 10
          done

          # Health check
          echo "Running health checks..."
          for i in {1..12}; do
            if curl -f -s http://127.0.0.1/healthz > /dev/null 2>&1; then
              echo "✓ Health check passed!"
              exit 0
            fi

            echo "[$i/12] Health check waiting..."
            sleep 5
          done

          echo "✗ Health check failed!"
          exit 1
          EOF
          bash /tmp/deploy.sh'" \
            --output-s3-bucket-name "estancorp-ssm-logs" \
            --output-s3-key-prefix "govhotel-deployments" \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Monitor SSM command execution
        run: |
          COMMAND_ID=${{ steps.ssm-deploy.outputs.command_id }}
          INSTANCE_ID=${{ steps.find-instance.outputs.instance_id }}

          # Poll command status (60 attempts × 10s = 10 minutes max)
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text \
              --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Unknown")

            echo "[$i/60] Command status: $STATUS"

            if [ "$STATUS" == "Success" ]; then
              echo "✓ Deployment successful!"
              exit 0
            elif [ "$STATUS" == "Failed" ]; then
              echo "✗ Deployment failed!"
              # Fetch command output
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }}
              exit 1
            fi

            sleep 10
          done

          echo "✗ Command timed out after 10 minutes"
          exit 1

      - name: Deployment complete
        if: success()
        run: |
          echo "✓ Deployment completed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Instance: ${{ steps.find-instance.outputs.instance_id }}"
